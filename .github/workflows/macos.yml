name: Myron R85 clean Data seed (no kernel build)

on:
  workflow_dispatch:
  push:
    branches: [codex/myron-r85-data-seed]

permissions:
  contents: read

concurrency:
  group: myron-clean-data-seed
  cancel-in-progress: false

jobs:
  seed:
    # The approved upload starts one job. Other branch commits do not consume a runner.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Build R85 clean Data seed once'
    # Sonoma matches the APFS generation used by the 21H461 target.
    # Label availability was checked against actions/runner-images on 2026-11-01.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out these scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned IPSW range reader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/UniXNU
          ref: 56aaad72df854febb77ee67a68ed486d0d882f1b
          path: upstream
          persist-credentials: false
      - name: Check out pinned packed-disk tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/DarwinBoot
          ref: 3325e352d7df68a9f9ad74832ed94a6acbbd7390
          path: upstream/drivers/DarwinBoot
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate fixture input guards
        run: python3 kernel/test_data_seed_r84.py
      - name: Fetch and verify original OS, then create clean Data
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python3)" kernel/ci_data_seed_r85.py \
            --unixnu "$GITHUB_WORKSPACE/upstream" \
            --out "$RUNNER_TEMP/myron-data-r85"
      - name: Save only the seed and verification records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-21H461-clean-data-512MiB
          path: |
            ${{ runner.temp }}/myron-data-r85/seed/data.dbr
            ${{ runner.temp }}/myron-data-r85/seed/seed.json
            ${{ runner.temp }}/myron-data-r85/ci-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
