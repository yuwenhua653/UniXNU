name: Myron iPhone iOS 27 desktop integration
on:
  workflow_dispatch:
  push:
    branches: [codex/myron-iphone27]
permissions:
  contents: read
concurrency:
  group: myron-iphone27-native
  cancel-in-progress: false
jobs:
  userland:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Qualify myron iPhone iOS 27 userland'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install original archive reader
        run: brew install blacktop/tap/ipsw
      - name: Check original iPhone userland and prepare volatile Data
        run: python3 myron27-build.py --userland
      - name: Preserve userland evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-iphone27-original-userland-reports-only
          path: ${{ runner.temp }}/myron-iphone27/reports/original-userland.json
          if-no-files-found: warn
          retention-days: 7
  kernel:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Build myron iPhone iOS 27 native kernel'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build tools
        run: brew install cmake ninja llvm lld unifdef dtc
      - name: Build pinned iPhone target
        run: python3 myron27-build.py
      - name: Compile myron UFS, build LTO reference and prelink iPhone drivers
        run: python3 myron27-build.py --desktop
      - name: Preserve native output and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-iphone27-desktop-integration-not-phone-firmware
          path: |
            ${{ runner.temp }}/myron-iphone27/reports
            ${{ runner.temp }}/myron-iphone27/out/**/logs
            ${{ runner.temp }}/myron-iphone27/out/**/kernel/kernel.macho
            ${{ runner.temp }}/myron-iphone27/out/**/kernel/kernel.json
            ${{ runner.temp }}/myron-iphone27/out/**/xnu-inputs.json
            ${{ runner.temp }}/myron-iphone27/desktop/*.json
            ${{ runner.temp }}/myron-iphone27/desktop/*.log
            ${{ runner.temp }}/myron-iphone27/desktop/ufs
            ${{ runner.temp }}/myron-iphone27/desktop/prelinked/*.json
            ${{ runner.temp }}/myron-iphone27/out/**/fileset-reference/mach.release.bcm2837.unstripped.noctf
            ${{ runner.temp }}/myron-iphone27/out/**/fileset-reference/mach.release.bcm2837.unstripped.json
            ${{ runner.temp }}/myron-iphone27/out/**/fileset-reference/*/*-build.log
          if-no-files-found: warn
          retention-days: 7
