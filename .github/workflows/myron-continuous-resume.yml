name: Myron resume qualified continuous firmware
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - .github/workflows/myron-continuous-resume.yml
      - myron27-continuous-firmware.py
      - myron27-package-continuous.py
      - myron_continuous_contract.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: myron-continuous-resume
  cancel-in-progress: true
jobs:
  firmware:
    # Resume only this explicitly pinned native build; other pushes are skipped.
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Resume myron firmware after compiled-recorder verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ae31e0b336d3be2c8323236124d129a3efa45de4
          path: qualified-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14508745611'
          run-id: '44473744687'
          github-token: ${{ github.token }}
          path: native-input
          merge-multiple: true
      - name: Check exact retained artifact before any build
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root=Path('native-input')
          expected={'root-startup.img':'8ce4bb5b2307be4a8d91524cdf0a6c0bfef78e829b329d80a27a2b6fbd540e55',
                    'deployment.json':'0a3363a44b2ccebb055cda041a95d1dcdd5a6b3c113ba6e7f7251e5d74743e53'}
          for name,digest in expected.items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          producer=json.loads((root/'producer.json').read_text())
          assert producer['source_commit']=='ae31e0b336d3be2c8323236124d129a3efa45de4'
          assert producer['run_id']=='44473744687'
      - name: Install firmware tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 qemu-system-arm mtools build-essential uuid-dev libssl-dev
          python3 -m pip install pyelftools==0.32 capstone==5.0.6 unicorn==2.1.4 lz4==4.4.5
      - name: Verify permission-error regression
        run: |
          python3 tests/test_collect_native_checks.py
          python3 tests/test_continuous_contract.py
      - name: Resume Linux firmware using the already compiled kernel
        run: |
          python3 myron27-continuous-firmware.py --base native-input \
            --source-repo qualified-source --producer-run 44473744687 \
            --work "$RUNNER_TEMP/continuous-work" --output "$RUNNER_TEMP/continuous-output" \
            --clang-bin /usr/lib/llvm-18/bin --qemu /usr/bin/qemu-system-aarch64
      - name: Package and test Windows update and Android restore helper
        run: |
          python3 myron27-package-continuous.py --candidate "$RUNNER_TEMP/continuous-output" \
            --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ready/myron-ios27-continuous-$GITHUB_RUN_ID.zip"
      - name: Preserve firmware diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-continuous-resume-checks
          path: |
            ${{ runner.temp }}/continuous-work/firmware/build.log
            ${{ runner.temp }}/continuous-work/firmware/firmware-verification.json
            ${{ runner.temp }}/continuous-work/root-handoff/report.json
            ${{ runner.temp }}/continuous-work/capsule-test/handoff-qemu.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-ready
          path: ${{ runner.temp }}/ready
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-candidate
          path: ${{ runner.temp }}/continuous-output
          if-no-files-found: error
          retention-days: 7


