name: Myron iOS27 Data helper
on:
  push:
    branches: [codex/myron-iphone27]
permissions:
  contents: read
concurrency:
  group: myron-data-helper
  cancel-in-progress: false
jobs:
  helper:
    if: github.event.head_commit.message == 'Build myron Data utilities'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and audit the bounded Data helper
        run: python3 myron-runtime/build_data_helper.py --out "$RUNNER_TEMP/myron-data-helper"
      - name: Check actual 16 GiB block-provider and migration paths
        run: |
          python3 myron27-build.py --source-only
          git init -q "$RUNNER_TEMP/ramblock"
          git -C "$RUNNER_TEMP/ramblock" fetch -q --depth 1 https://github.com/UniXNU/RamBlock.git 4be2d7eb05ef5a98126c91e0302c149140c0e3e1
          git -C "$RUNNER_TEMP/ramblock" checkout -q --detach FETCH_HEAD
          python3 myron-runtime/check.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --ramblock "$RUNNER_TEMP/ramblock" --cxx clang++ --output "$RUNNER_TEMP/myron-data-helper/host-checks.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-data-helper-candidate
          path: ${{ runner.temp }}/myron-data-helper/
          if-no-files-found: error
          retention-days: 7
