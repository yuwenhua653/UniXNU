name: Myron APFS Data directory check
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - '.github/workflows/myron-data-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  data-layout:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create Data using the production copier and reopen the APFS image read-only
        run: |
          python3 myron27-build.py --source-only
          sudo -n "$(command -v python3)" "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/check_data_volume.py" --out "$RUNNER_TEMP/data-layout-check"
      - name: Check the previously tested package while the retained artifact is available
        if: github.event.head_commit.message == 'Restore the first-boot container directory layout on myron'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44667978236 --name myron-ios27-continuous-ready --dir "$RUNNER_TEMP/retained-package"
          sudo -n "$(command -v python3)" tests/test_myron_retained_data_layout.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --package "$RUNNER_TEMP/retained-package/myron-ios27-continuous-44667978236.zip"

      - name: Verify compositor preferences on the hardware-tested Data seed
        if: github.event.head_commit.message == 'Set myron boot framebuffer preferences for CPU scanout'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44683732571 --name myron-ios27-continuous-ready --dir "$RUNNER_TEMP/retained-render-input"
          sudo -n "$(command -v python3)" tests/test_myron_render_seed.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --package "$RUNNER_TEMP/retained-render-input/myron-ios27-continuous-44683732571.zip"
