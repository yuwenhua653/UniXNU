name: Myron device-bound root package
on:
  push:
    branches: [codex/myron-iphone27]
  workflow_dispatch:
    inputs:
      inputs_url:
        description: Temporary HTTPS URL for the approved device input archive (no private keys)
        required: true
        type: string
      inputs_sha256:
        description: SHA256 of the exact approved input archive
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: myron-device-package
  cancel-in-progress: false
jobs:
  handoff:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Build myron device-bound iOS 27 package'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install capsule test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld qemu-system-arm mtools
          python3 -m pip install pyelftools==0.32
      - name: Reconstruct and execute exact capsule before the native build
        run: |
          python3 myron27-build.py --source-only
          python3 -m unittest discover -s tests -p test_continuous_contract.py -v
          python3 tests/test_myron_progress.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --cc clang --target-cc clang
          python3 tests/test_myron_ufs_mount.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --cxx clang++
          python3 tests/test_myron_bds.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --cc clang
          python3 -m unittest discover -s "$RUNNER_TEMP/myron-iphone27/device/myron27/tests" -p test_root_firmware.py -v
          git init "$RUNNER_TEMP/loader-headers"
          git -C "$RUNNER_TEMP/loader-headers" fetch --depth 1 https://github.com/microsoft/mu_basecore.git cfb93724a06ff86ff5ba971413368a7809ee42a5
          git -C "$RUNNER_TEMP/loader-headers" checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_handoff_qemu.py" \
            --clang /usr/bin/clang --qemu /usr/bin/qemu-system-aarch64 \
            --edk2 "$RUNNER_TEMP/loader-headers" --out "$RUNNER_TEMP/handoff-check"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: myron-handoff-regression-check
          path: ${{ runner.temp }}/handoff-check
          if-no-files-found: warn
          retention-days: 7
  inputs:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Build myron device-bound iOS 27 package'
    # Draft release assets require push access. This job only downloads and
    # verifies inputs; no native build or dependency installation runs here.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download and verify approved input archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MYRON_INPUT_URL: ${{ inputs.inputs_url || 'https://api.github.com/repos/yuwenhua653/UniXNU/releases/assets/738057218' }}
          MYRON_INPUT_SHA256: ${{ inputs.inputs_sha256 || '8e0b3b98e48ade9ff82ac4f85128e37327f2e69ac4191add64552b85a9e6ba48' }}
        run: |
          echo "::add-mask::$MYRON_INPUT_URL"
          python3 myron27-device-build.py --download-only
      - name: Transfer verified inputs to build job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-device-inputs
          path: ${{ runner.temp }}/device-inputs.zip
          if-no-files-found: error
          retention-days: 1
      - name: Remove downloaded inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/myron-private-inputs"
          rm -f "$RUNNER_TEMP/device-inputs.zip"
  package:
    needs: [inputs, handoff]
    permissions:
      contents: read
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-device-inputs
          path: ${{ runner.temp }}
      - name: Check authenticated public-header access before build setup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          sources = (
              ('iokit/DriverKit', 'xnu-10063.121.3'),
              ('iokit/DriverKit/crypto', 'xnu-10063.121.3'),
              ('EXTERNAL_HEADERS/TrustCache', 'xnu-8796.101.5'),
          )
          for path, tag in sources:
              url = f'https://api.github.com/repos/apple-oss-distributions/xnu/contents/{path}?ref={tag}'
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'myron-public-header-preflight',
                  'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  entries = json.load(response)
              assert isinstance(entries, list) and any(
                  e.get('type') == 'file' and e.get('name', '').endswith('.h')
                  and e.get('sha') for e in entries), f'Header inventory missing: {path}'
              print(f'PASS public header access: {path} at {tag}')
      - name: Install build dependencies
        run: |
          python3 -m pip install capstone==5.0.6
          brew install cmake ninja llvm lld unifdef dtc mtools openssl@3 blacktop/tap/ipsw
      - name: Build and export exact device package
        env:
          # The pinned public-header fetcher already supports authenticated GitHub requests.
          # This job retains contents: read; do not expose this token as a command argument.
          GITHUB_TOKEN: ${{ github.token }}
          MYRON_INPUT_SHA256: ${{ inputs.inputs_sha256 || '8e0b3b98e48ade9ff82ac4f85128e37327f2e69ac4191add64552b85a9e6ba48' }}
        run: python3 myron27-device-build.py --input-archive "$RUNNER_TEMP/device-inputs.zip"
      - name: Check retained root compatibility and prepare boot-only candidate
        shell: python
        run: |
          import hashlib, json, os, shutil
          from pathlib import Path
          package = Path(os.environ['RUNNER_TEMP'])/'myron-private-native/device-package'
          manifest = json.loads((package/'deployment.json').read_text())
          root = manifest['files']['root-container.raw']
          assert root['bytes'] == 15092154368
          assert root['sha256'] == '7d3b1200d14e4f27f12ef1680184033b0f95035475635f57c5b4130c28cdb81c'
          out = Path(os.environ['RUNNER_TEMP'])/'boot-regression'
          out.mkdir()
          for name in ('root-startup.img', 'deployment.json'):
              shutil.copyfile(package/name, out/name)
          image = out/'root-startup.img'
          assert hashlib.sha256(image.read_bytes()).hexdigest() == manifest['files'][image.name]['sha256']
          (out/'producer.json').write_text(json.dumps(dict(
              source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              source_delta_sha256=hashlib.sha256(Path('myron27-storage-delta.json').read_bytes()).hexdigest(),
              manifest_sha256=hashlib.sha256((out/'deployment.json').read_bytes()).hexdigest(),
              boot_sha256=hashlib.sha256(image.read_bytes()).hexdigest()), indent=2)+'\n')
          (out/'README.txt').write_text(
              'Intermediate native payload only. Wait for the Linux firmware job.\n'
              'Root image identity matches installed build 43165530177.\n'
              'Do not replace package/state metadata or manually flash this image.\n'
              'A checked boot-update companion must bind the existing backup and installation receipt first.\n'
              'Early BDS phases: B001-B006 before/through console setup, B010-B017 application launch; B0FF application returned an error.\n'
              'Phases: 2700 cache sweep, 2701 key access, 2702 EL1 PAC, 2703 EL0/SVC, 2704 pre-XNU branch.\n'
              '2704 is not evidence that XNU executed.\n')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-native-continuous-input
          path: ${{ runner.temp }}/boot-regression
          if-no-files-found: error
          retention-days: 7
      - name: Stage readable native diagnostic files
        if: always()
        continue-on-error: true
        run: python3 myron27-collect-native-checks.py --temp "$RUNNER_TEMP" --output "$RUNNER_TEMP/native-checks-upload"
      - name: Preserve native failure details and recorder ABI evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-continuous-native-checks
          path: ${{ runner.temp }}/native-checks-upload
          if-no-files-found: warn
          retention-days: 7
      - name: Remove private build inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/myron-private-inputs"
          rm -f "$RUNNER_TEMP/myron-device-session.json" "$RUNNER_TEMP/device-inputs.zip"

  linux-firmware:
    needs: package
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: myron-ios27-native-continuous-input
          path: native-input
      - name: Install phone-tested firmware compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 qemu-system-arm mtools build-essential uuid-dev libssl-dev
          python3 -m pip install pyelftools==0.32 capstone==5.0.6 unicorn==2.1.4
      - name: Automatically assemble continuous kernel with Linux firmware
        run: |
          python3 myron27-continuous-firmware.py --base native-input \
            --work "$RUNNER_TEMP/continuous-work" --output "$RUNNER_TEMP/continuous-output" \
            --clang-bin /usr/lib/llvm-18/bin --qemu /usr/bin/qemu-system-aarch64
      - name: Package checked Windows startup helper
        run: |
          python3 myron27-package-continuous.py --candidate "$RUNNER_TEMP/continuous-output" \
            --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ready/myron-ios27-continuous-$GITHUB_RUN_ID.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-ready
          path: ${{ runner.temp }}/ready
          if-no-files-found: error
          retention-days: 7
      - name: Preserve final firmware checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-continuous-firmware-checks
          path: |
            ${{ runner.temp }}/continuous-work/firmware/build.log
            ${{ runner.temp }}/continuous-work/firmware/firmware-verification.json
            ${{ runner.temp }}/continuous-work/root-handoff/report.json
            ${{ runner.temp }}/continuous-work/capsule-test/handoff-qemu.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-candidate
          path: ${{ runner.temp }}/continuous-output
          if-no-files-found: error
          retention-days: 7


