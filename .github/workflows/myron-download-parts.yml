name: Myron resumable ZIP parts
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - myron-download/**
      - .github/workflows/myron-download-parts.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s myron-download -p test_parts.py -v
  split:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact successful archive and split with full SHA256 verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 myron-download/split_artifact.py
      - name: Prepare Windows merge tools
        shell: python
        run: |
          from pathlib import Path
          import shutil
          p=Path('merge-tools');p.mkdir()
          for name in ('merge_parts.py','MERGE.cmd','README-CN.txt'):
              shutil.copyfile(Path('myron-download')/name,p/name)
          shutil.copyfile('split-parts/parts.json',p/'parts.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-root-merge-tools
          path: merge-tools
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-root-part00
          path: split-parts/myron-ios27-device-root-package.zip.part00
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-root-part01
          path: split-parts/myron-ios27-device-root-package.zip.part01
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
