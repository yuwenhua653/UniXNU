name: Myron original-cache fault analysis
on:
  push:
    branches: [codex/myron-iphone27]
permissions:
  contents: read
concurrency:
  group: myron-fault-analysis
  cancel-in-progress: false
jobs:
  analyze:
    if: github.event.head_commit.message == 'Analyze myron launchd fault'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check parsers before original image extraction
        run: |
          set -euo pipefail
          python3 -m pip install capstone==5.0.9
          python3 myron27-build.py --source-only
          python3 myron27-fault-extract.py --self-test
          python3 -m unittest discover -s tests -p test_myron_fault_symbolicate.py -v 2>&1 | tee "$RUNNER_TEMP/fault-parser-tests.log"
      - name: Prepare pinned original-image helpers
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/fault-upstream"
          git -C "$RUNNER_TEMP/fault-upstream" fetch -q --depth 1 https://github.com/UniXNU/UniXNU.git 04573c510c5fd4892ca6948739389141cc9e05f5
          git -C "$RUNNER_TEMP/fault-upstream" checkout -q --detach FETCH_HEAD
          brew install blacktop/tap/ipsw
      - name: Analyze exact original SystemOS without rebuilding XNU
        run: |
          set -euo pipefail
          fault_python="$(python3 -c 'import sys; print(sys.executable)')"
          fault_ipsw="$(python3 -c 'import pathlib, shutil; print(pathlib.Path(shutil.which("ipsw")).resolve())')"
          sudo -n "$fault_python" myron27-fault-extract.py \
            --device "$RUNNER_TEMP/myron-iphone27/device/myron27" \
            --upstream "$RUNNER_TEMP/fault-upstream" \
            --work "$RUNNER_TEMP/fault-private" \
            --output "$RUNNER_TEMP/fault-public" \
            --archive-tool "$fault_ipsw" \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Preserve only bounded analysis evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-launchd-fault-analysis
          path: |
            ${{ runner.temp }}/fault-public/extraction.json
            ${{ runner.temp }}/fault-public/symbolication.json
            ${{ runner.temp }}/fault-parser-tests.log
          if-no-files-found: warn
          retention-days: 7
