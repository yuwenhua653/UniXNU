name: Myron A840 native source checks
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - myron-gpu/**
      - myron-runtime/**
      - myron-touch/**
      - myron27-build.py
      - tests/test_myron_log_worker.py
      - tests/test_myron_runtime_upgrade.py
      - scripts/build-turnip-darwin.py
      - patches/mesa/turnip-darwin-kmd.patch
      - .github/workflows/myron-gpu-host.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: myron-gpu-host
  cancel-in-progress: false
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct the actual board source
        run: python3 myron27-build.py --source-only
      - name: Check addon mount and Metal publication on Linux
        run: |
          python3 myron-runtime/test_gpu_addon_mount.py
          python3 myron-gpu/native/test_metal_publish.py --cxx g++
      - name: Check bounded Data persistence and physical power input
        run: |
          git init "$RUNNER_TEMP/ramblock-runtime"
          git -C "$RUNNER_TEMP/ramblock-runtime" fetch --depth 1 https://github.com/UniXNU/RamBlock.git 4be2d7eb05ef5a98126c91e0302c149140c0e3e1
          git -C "$RUNNER_TEMP/ramblock-runtime" checkout --detach FETCH_HEAD
          python3 myron-runtime/check.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --ramblock "$RUNNER_TEMP/ramblock-runtime" --cxx g++
      - name: Fetch pinned A8xx dependencies
        run: |
          python3 myron-gpu/native/prepare_sources.py \
            --references "$RUNNER_TEMP/gpu-references" --fetch
      - name: Exercise actual display producer fence gate
        run: python3 myron-gpu/native/test_display_fences.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --cxx g++
      - name: Exercise portable board and real native backend algorithms
        run: |
          mkdir -p "$RUNNER_TEMP/gpu-checks"
          python3 myron-gpu/check_host.py --cc gcc --output "$RUNNER_TEMP/gpu-checks/portable.json"
          python3 myron-gpu/native/check_native_host.py \
            --references "$RUNNER_TEMP/gpu-references" --cc gcc --cxx g++ \
            --output "$RUNNER_TEMP/gpu-checks/native-host.json"
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/gpu/check_native_host.py" \
            --references "$RUNNER_TEMP/gpu-references" --cc gcc --cxx g++ \
            --output "$RUNNER_TEMP/gpu-checks/staged-native-host.json"
          python3 myron-gpu/native/test_userspace.py --references "$RUNNER_TEMP/gpu-references" \
            --cxx g++ > "$RUNNER_TEMP/gpu-checks/userspace-abi.json"
          python3 tests/test_native_diagnostics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: myron-a840-source-checks
          path: ${{ runner.temp }}/gpu-checks
          if-no-files-found: warn
          retention-days: 7
  arm64e-boundaries:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Reconstruct and check actual arm64e display and power boundaries
        run: |
          python3 myron-runtime/test_gpu_addon_mount.py
          python3 myron-gpu/native/test_metal_publish.py --cxx clang++
          python3 myron27-build.py --source-only
          python3 myron-gpu/native/test_display_fences.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --cxx clang++
          python3 myron-runtime/test_power.py --cxx clang++
