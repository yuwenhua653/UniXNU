name: Myron fast masked-WFE compatibility
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - .github/workflows/myron-idle-compat.yml
      - myron27-idle-compat-firmware.py
      - myron27-package-idle-compat.py
      - myron27_idle_compat.py
      - tests/test_idle_compat.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: myron-idle-compat
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e7cd64972d3a5725f1a13d130806729a21101361
          path: qualified-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '14018238088'
          run-id: '43379932443'
          github-token: ${{ github.token }}
          path: native-input
          merge-multiple: true
      - name: Check exact retained artifact before any build
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root=Path('native-input')
          expected={'root-startup.img':'17604cd4f01b779f782683916486d4cd0a7ed56e874d41bdfdf1751f764b4abf',
                    'deployment.json':'2c9b641991054bf94d9eee05469bae19f251ee44857d2d933ad365cf08229ab1'}
          for name,digest in expected.items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          producer=json.loads((root/'producer.json').read_text())
          assert producer['source_commit']=='e7cd64972d3a5725f1a13d130806729a21101361'
          assert producer['run_id']=='43379932443'
      - name: Install firmware tools only
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 qemu-system-arm mtools build-essential uuid-dev libssl-dev
          python3 -m pip install pyelftools==0.32 capstone==5.0.6 unicorn==2.1.4 pyfatfs==1.1.0 'setuptools<81'
      - name: Verify single-scalar derivative and rejection guards
        run: |
          python3 tests/test_idle_compat.py --boot native-input/root-startup.img
      - name: Verify permission-error regression
        run: |
          python3 tests/test_collect_native_checks.py
          python3 tests/test_continuous_contract.py
      - name: Resume Linux firmware using the already compiled kernel
        run: |
          python3 myron27-idle-compat-firmware.py --base native-input \
            --source-repo qualified-source --producer-run 43379932443 \
            --work "$RUNNER_TEMP/continuous-work" --output "$RUNNER_TEMP/continuous-output" \
            --clang-bin /usr/lib/llvm-18/bin --qemu /usr/bin/qemu-system-aarch64
      - name: Package and test Windows update and Android restore helper
        run: |
          python3 myron27-package-idle-compat.py --candidate "$RUNNER_TEMP/continuous-output" \
            --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ready/myron-ios27-idle-compat-$GITHUB_RUN_ID.zip"
      - name: Preserve firmware diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-idle-compat-checks
          path: |
            ${{ runner.temp }}/continuous-work/idle-compatibility.json
            ${{ runner.temp }}/continuous-work/firmware/build.log
            ${{ runner.temp }}/continuous-work/firmware/firmware-verification.json
            ${{ runner.temp }}/continuous-work/root-handoff/report.json
            ${{ runner.temp }}/continuous-work/capsule-test/handoff-qemu.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-ready
          path: ${{ runner.temp }}/ready
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-continuous-candidate
          path: ${{ runner.temp }}/continuous-output
          if-no-files-found: error
          retention-days: 7
