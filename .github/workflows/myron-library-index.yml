name: Myron original system library index
on:
  push:
    branches: [codex/myron-iphone27]
permissions:
  contents: read
concurrency:
  group: myron-library-index
  cancel-in-progress: false
jobs:
  index:
    if: github.event.head_commit.message == 'Build myron Data utilities' || github.event.head_commit.message == 'Index original myron system libraries' || github.event.head_commit.message == 'Build myron iOS27 GPU userspace' || github.event.head_commit.message == 'Build myron device-bound iOS 27 package'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check parsers and reconstruct pinned sources
        run: |
          set -euo pipefail
          python3 -m pip install capstone==5.0.9
          python3 myron27-build.py --source-only
          python3 myron27-fault-extract.py --self-test
          python3 -m unittest discover -s tests -p test_myron_library_index.py -v
          python3 -m unittest discover -s tests -p test_myron_posterboard_context.py -v
          python3 -m unittest discover -s tests -p test_myron_fault_symbolicate.py -v
          git init -q "$RUNNER_TEMP/index-upstream"
          git -C "$RUNNER_TEMP/index-upstream" fetch -q --depth 1 https://github.com/UniXNU/UniXNU.git 04573c510c5fd4892ca6948739389141cc9e05f5
          git -C "$RUNNER_TEMP/index-upstream" checkout -q --detach FETCH_HEAD
          brew install blacktop/tap/ipsw
      - name: Export static library index without rebuilding XNU
        run: |
          set -euo pipefail
          index_python="$(python3 -c 'import sys; print(sys.executable)')"
          index_ipsw="$(python3 -c 'import pathlib, shutil; print(pathlib.Path(shutil.which("ipsw")).resolve())')"
          sudo -n "$index_python" myron27-library-index.py --device "$RUNNER_TEMP/myron-iphone27/device/myron27" --upstream "$RUNNER_TEMP/index-upstream" --work "$RUNNER_TEMP/index-private" --output "$RUNNER_TEMP/index-public" --archive-tool "$index_ipsw"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-original-library-index
          path: ${{ runner.temp }}/index-public/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove original image workspace
        if: always()
        run: sudo -n rm -rf "$RUNNER_TEMP/index-private"
