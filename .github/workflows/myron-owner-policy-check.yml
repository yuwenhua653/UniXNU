name: Myron signed policy integration
on:
  push:
    branches: [codex/myron-iphone27]
    paths:
      - myron27-build.py
      - myron27-storage-delta.json
      - .github/workflows/myron-owner-policy-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct and verify signed policy integration
        run: |
          python3 myron27-build.py --source-only
          git clone https://github.com/UniXNU/VerifiedRoot.git "$RUNNER_TEMP/VerifiedRoot"
          git -C "$RUNNER_TEMP/VerifiedRoot" checkout --detach 974f043d0c71ba2e60331483a41c6c6d35274ee3
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_original_root.py" --verified-root "$RUNNER_TEMP/VerifiedRoot" -v
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_owner_request.py" -v
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_device_deployment.py" -v
