name: Myron iOS 27 owner signing request
on:
  workflow_dispatch:
  push:
    branches: [codex/myron-iphone27]
permissions:
  contents: read
concurrency:
  group: myron-iphone27-owner-request
  cancel-in-progress: false
jobs:
  request:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Prepare myron iOS 27 owner signing request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct source and test signing exchange before downloads
        run: |
          python3 myron27-build.py --source-only
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_device_deployment.py" -v
          python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/tests/test_owner_request.py" -v
      - name: Install original archive reader and analyzer
        run: |
          python3 -m pip install capstone==5.0.6
          for attempt in 1 2 3; do
            if brew install --formula blacktop/tap/ipsw; then
              ipsw version
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ipsw installation failed after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
      - name: Prepare and audit original root without rebuilding XNU
        run: python3 myron27-build.py --userland
      - name: Export hash tables for local owner signing
        run: |
          sudo -n python3 "$RUNNER_TEMP/myron-iphone27/device/myron27/owner_request.py" prepare \
            --report "$RUNNER_TEMP/myron-iphone27/reports/original-userland.json" \
            --root-image "$RUNNER_TEMP/myron-iphone27/private-userland/root-media/root-container.raw" \
            --source-commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/myron-iphone27/owner-request"
          sudo -n chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/myron-iphone27/owner-request"
      - name: Preserve request hashes and audit evidence only
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-owner-signing-request-hashes-only
          path: ${{ runner.temp }}/myron-iphone27/owner-request
          if-no-files-found: error
          retention-days: 7
      - name: Preserve preparation report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: myron-ios27-owner-request-failure-report
          path: ${{ runner.temp }}/myron-iphone27/reports
          if-no-files-found: warn
          retention-days: 7
